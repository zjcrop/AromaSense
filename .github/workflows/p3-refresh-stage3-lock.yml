name: P3 refresh Stage 3 lock

on:
  push:
    branches:
      - stage3-p3-consumer-reconcile-20260907

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3-p3-consumer-reconcile-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate exact npm lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit exact lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already exact"
            exit 0
          fi
          git commit -m "chore: refresh Stage 3 LuckyBean lock"
          git push origin HEAD:stage3-p3-consumer-reconcile-20260907
