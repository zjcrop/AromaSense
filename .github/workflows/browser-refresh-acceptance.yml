name: AromaSense browser refresh acceptance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  browser-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build browser application
        run: npm run bundle:web
      - name: Verify Chrome is available
        run: google-chrome --version
      - name: Run hard-refresh recovery acceptance
        env:
          AROMASENSE_ACCEPTANCE_DEBUG: '1'
        run: node scripts/browser-refresh-acceptance.mjs
