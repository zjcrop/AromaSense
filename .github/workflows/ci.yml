name: AromaSense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-persistence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and tests
        run: npm run check
      - name: Bundle WebView application
        run: npm run bundle:web
      - name: Install Worker dependencies
        run: npm install --prefix cloud/worker --no-audit --no-fund
      - name: Typecheck Cloudflare Worker
        run: npm --prefix cloud/worker run typecheck

  android-debug:
    runs-on: ubuntu-latest
    needs: core-persistence
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Assemble B0.1.a debug APK
        env:
          AROMASENSE_CLOUD_URL: ${{ vars.AROMASENSE_CLOUD_URL }}
        run: gradle -p mobile/android :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AromaSense-B0.1.a-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
