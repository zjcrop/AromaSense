name: AromaSense CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  firebase-auth-config:
    runs-on: ubuntu-latest
    env:
      AROMASENSE_FIREBASE_API_KEY: AIzaSyAsY_w3pxgBlnr0tFYKuAvNJUeEhN1RCU0
      AROMASENSE_FIREBASE_PROJECT_ID: romasense-f23eb
      AROMASENSE_PUBLIC_APP_URL: https://zjcrop.github.io/AromaSense/
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify Firebase API key and authorized domain
        shell: bash
        run: |
          node - <<'NODE'
          const key = process.env.AROMASENSE_FIREBASE_API_KEY;
          const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=${encodeURIComponent(key)}`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              identifier: `aromasense-smoke-${Date.now()}@example.invalid`,
              continueUri: process.env.AROMASENSE_PUBLIC_APP_URL
            })
          });
          const body = await response.json();
          console.log('Firebase createAuthUri status:', response.status);
          if (!response.ok) throw new Error(`Firebase API key / authorized-domain check failed: ${body?.error?.message ?? response.status}`);
          NODE
      - name: Verify email password provider is enabled
        shell: bash
        run: |
          node - <<'NODE'
          const key = process.env.AROMASENSE_FIREBASE_API_KEY;
          const response = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${encodeURIComponent(key)}`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              email: `aromasense-smoke-${Date.now()}@example.invalid`,
              password: 'AromaSense-Smoke-Only-9x!',
              returnSecureToken: true
            })
          });
          const body = await response.json();
          const code = body?.error?.message ?? '';
          console.log('Firebase password-provider probe:', response.status, code);
          if (response.ok) throw new Error('Unexpected smoke account matched an existing Firebase user');
          if (code === 'OPERATION_NOT_ALLOWED') throw new Error('Firebase Email/Password provider is disabled');
          if (/API_KEY|PROJECT_NOT_FOUND|CONFIGURATION_NOT_FOUND/.test(code)) throw new Error(`Firebase project configuration invalid: ${code}`);
          if (!/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN_CREDENTIALS|USER_NOT_FOUND/.test(code)) {
            throw new Error(`Unexpected Firebase auth response: ${code || response.status}`);
          }
          NODE

  core-persistence:
    runs-on: ubuntu-latest
    needs: firebase-auth-config
    env:
      AROMASENSE_CLOUD_URL: ${{ vars.AROMASENSE_CLOUD_URL }}
      AROMASENSE_FIREBASE_API_KEY: AIzaSyAsY_w3pxgBlnr0tFYKuAvNJUeEhN1RCU0
      AROMASENSE_FIREBASE_PROJECT_ID: romasense-f23eb
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and tests
        run: npm run check
      - name: Bundle WebView application
        run: npm run bundle:web
      - name: Install Worker dependencies
        run: npm install --prefix cloud/worker --no-audit --no-fund
      - name: Typecheck Cloudflare Worker
        run: npm --prefix cloud/worker run typecheck

  android-debug:
    runs-on: ubuntu-latest
    needs: core-persistence
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Assemble B0.1.a debug APK
        env:
          AROMASENSE_CLOUD_URL: ${{ vars.AROMASENSE_CLOUD_URL }}
          AROMASENSE_FIREBASE_API_KEY: AIzaSyAsY_w3pxgBlnr0tFYKuAvNJUeEhN1RCU0
          AROMASENSE_FIREBASE_PROJECT_ID: romasense-f23eb
        run: gradle -p mobile/android :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AromaSense-B0.1.a-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
