name: Stage 3 lock reconcile

on:
  push:
    branches:
      - stage3-shared-record-candidates-20260906

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 3 branch
        uses: actions/checkout@v4
        with:
          ref: stage3-shared-record-candidates-20260906
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate package lock from exact manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit reconciled lock only when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: reconcile Stage 3 LuckyBean dependency lock"
          git push origin HEAD:stage3-shared-record-candidates-20260906
