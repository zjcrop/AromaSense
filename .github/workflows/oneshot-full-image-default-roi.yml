name: One-shot full-image default recognition migration

on:
  push:
    paths:
      - '.github/workflows/oneshot-full-image-default-roi.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Apply migration
        run: python3 scripts/oneshot-full-image-default-roi.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete checks
        run: npm run check
      - name: Bundle web application
        run: npm run bundle:web
      - name: Remove one-shot files
        run: |
          rm -f scripts/oneshot-full-image-default-roi.py
          rm -f .github/workflows/oneshot-full-image-default-roi.yml
      - name: Commit product migration
        run: |
          git config user.name 'zjcrop'
          git config user.email '127176814+zjcrop@users.noreply.github.com'
          git add -A
          git commit -m 'feat(recognition): make whole-image OCR default with manual ROI supplement'
          git push origin HEAD:main
