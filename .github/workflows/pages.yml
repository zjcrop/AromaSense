name: Manual AromaSense Web Deploy B0.1.a

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aromasense-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      AROMASENSE_CLOUD_URL: ${{ vars.AROMASENSE_CLOUD_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate manual cloud endpoint override
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AROMASENSE_CLOUD_URL:-}" || (echo "Manual Pages deployment requires repository variable AROMASENSE_CLOUD_URL. Normal production deployment is handled by deploy-cloud.yml and does not require this variable." && exit 1)
          case "$AROMASENSE_CLOUD_URL" in
            https://*) ;;
            *) echo "AROMASENSE_CLOUD_URL must use https://"; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build browser version
        run: npm run bundle:web

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euxo pipefail
          test -f site/index.html
          test -f site/app.js
          test -f site/sql-wasm.wasm
          ! grep -q '__CLOUD_BASE_URL__' site/index.html
          grep -Fq "data-cloud-base-url=\"$AROMASENSE_CLOUD_URL\"" site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
