name: Regenerate Foundation lockfile

on:
  push:
    branches:
      - feature/roi-second-pass-recognition-20260905
    paths:
      - package.json
      - .github/workflows/regenerate-lock-temp.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/roi-second-pass-recognition-20260905
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(foundation): refresh lockfile for ROI base"
          git push origin HEAD:feature/roi-second-pass-recognition-20260905
