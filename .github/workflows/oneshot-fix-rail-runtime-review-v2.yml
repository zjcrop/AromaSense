          python - <<'PY'
          from pathlib import Path
          import re

          def replace1(path, old, new):
              p = Path(path); text = p.read_text(); n = text.count(old)
              if n != 1: raise SystemExit(f"{path}: expected 1 literal match, got {n}: {old[:180]!r}")
              p.write_text(text.replace(old, new, 1))

          def sub1(path, pattern, replacement):
              p = Path(path); text = p.read_text(); out, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if n != 1: raise SystemExit(f"{path}: expected 1 regex match, got {n}: {pattern[:180]!r}")
              p.write_text(out)

