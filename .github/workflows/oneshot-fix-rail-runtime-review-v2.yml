               '''function targetActiveTabGeometry(root: HTMLElement): ActiveTabGeometry | undefined {
  const state = ensureActiveTabState(root);
  const card = activeCard(root);
  const number = card?.querySelector<HTMLElement>(".sample-rail__number");
  const copy = card?.querySelector<HTMLElement>(".sample-rail__active-copy");
  const railHost = state.railHost;
  const viewport = state.scrollContainer;
  if (!card || !number || !railHost || !viewport) return undefined;
  const cardRect = card.getBoundingClientRect();
  const numberRect = number.getBoundingClientRect();
  const copyRect = copy?.getBoundingClientRect();
  const railRect = railHost.getBoundingClientRect();
  const viewportRect = viewport.getBoundingClientRect();
  const compact = root.classList.contains("is-compact");
  const requiredHeight = Math.max(numberRect.height + (compact ? 6 : 8), (copyRect?.height ?? 0) + 12);
  const height = Math.ceil(Math.max(compact ? 33 : 48, requiredHeight));
  const protrusion = compact ? 9 : 16;
  const left = Math.max(2, Math.round(cardRect.left - railRect.left - 2));
  const visible = cardRect.bottom > viewportRect.top && cardRect.top < viewportRect.bottom;
  return {
    top: Math.round(cardRect.top - railRect.top + cardRect.height / 2 - height / 2),
    left,
    width: Math.max(compact ? 38 : 54, Math.round(railRect.width + protrusion - left - 2)),
    height,
    visible
  };
}

