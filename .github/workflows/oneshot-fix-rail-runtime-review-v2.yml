name: One-shot rail and runtime review repair v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneshot-fix-rail-runtime-review-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply guarded source repair
        shell: bash
