name: Stage 2 dependency lock reconcile

on:
  push:
    branches:
      - stage2-recognition-diagnostics-20260906
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/stage2-lock-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Stage 2 branch
        uses: actions/checkout@v7
        with:
          ref: stage2-recognition-diagnostics-20260906
          fetch-depth: 1
      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Regenerate npm lock from pinned manifest
        run: npm install --no-audit --no-fund
      - name: Commit reconciled lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'build: reconcile LuckyBean Stage 2 lockfile'
          git push origin HEAD:stage2-recognition-diagnostics-20260906
