name: Pin Foundation 0.4.12 Region Live
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pin-foundation-0412-region-live.yml'
permissions:
  contents: write
jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Pin Foundation and strengthen Region live acceptance
        run: |
          python - <<'PY'
          from pathlib import Path
          OLD='129cb5e98dc3745acd0778f7cf45803088da3bee'
          NEW='fc12bcf01a8366734a681d7e33694920b52e99bd'
          p=Path('package.json'); s=p.read_text(encoding='utf-8')
          if s.count(OLD)!=1: raise SystemExit('package.json old Foundation pin mismatch')
          p.write_text(s.replace(OLD,NEW,1),encoding='utf-8')

          p=Path('tests/ocr-freeze-regression.test.ts'); s=p.read_text(encoding='utf-8')
          if s.count(OLD)!=1: raise SystemExit('OCR regression pin mismatch')
          s=s.replace(OLD,NEW,1)
          if s.count("const VERSION = '0\\.4\\.11'")!=1: raise SystemExit('OCR regression provider version anchor mismatch')
          s=s.replace("const VERSION = '0\\.4\\.11'","const VERSION = '0\\.4\\.12'",1)
          anchor="  assert.match(paddleOcrSource, /startSessionCompatibilityEngine/u);\n"
          extra=(anchor+
            "  assert.match(paddleOcrSource, /async function startWebKitEngine\\(\\)/u);\n"
            "  assert.match(paddleOcrSource, /WEBKIT \\? startWebKitEngine\\(\\)/u);\n"
            "  assert.match(paddleOcrSource, /return startSessionCompatibilityEngine\\(generation, error\\)/u);\n"
            "  assert.match(paddleOcrSource, /webkit-direct-wasm-no-simd->direct-module-worker-wasm-no-simd->direct-wasm-no-simd-last-resort/u);\n")
          if s.count(anchor)!=1: raise SystemExit('WebKit regression anchor mismatch')
          s=s.replace(anchor,extra,1)
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/live-pages-smoke.mjs'); s=p.read_text(encoding='utf-8')
          old="if (api?.version !== '0.4.11') throw new Error('Expected PP-OCRv5 0.4.11 ONNX-session-compatible provider');"
          new="if (api?.version !== '0.4.12') throw new Error('Expected PP-OCRv5 0.4.12 Region ONNX-session-compatible provider');"
          if s.count(old)!=1: raise SystemExit('live provider version anchor mismatch')
          s=s.replace(old,new,1)
          fn_anchor="      if (typeof core?.recognizeCoffeeBag !== 'function') throw new Error('Expected AromaSense bounded recognition core');\n"
          fn_new=(fn_anchor+
            "      if (typeof core?.preparePackageImage !== 'function' || typeof core?.recognizeImageRegion !== 'function') throw new Error('Expected production Region OCR core');\n")
          if s.count(fn_anchor)!=1: raise SystemExit('live Region capability anchor mismatch')
          s=s.replace(fn_anchor,fn_new,1)

          old_try="""      try {\n        const result = await core.recognizeCoffeeBag([{ id: 'live-high-res-ocr-check', role: 'front', blob }], { locale: 'zh-CN' });\n        return {\n          text: result.fullText,\n          blocks: result.blocks.length,\n"""
          new_try="""      try {\n        // Region-first is intentional: this is the same cold-start order as the\n        // post-segmentation browser flow reported by users. Do not warm whole-image OCR first.\n        const prepared = await core.preparePackageImage(blob);\n        const source = { id: 'live-region-source', role: 'front', blob: prepared.blob, nativeSource: Boolean(prepared.nativeSource), fileName: 'live-region.jpg' };\n        const region1 = await core.recognizeImageRegion(source, { x: 0.03, y: 0.14, width: 0.78, height: 0.24, coordinateSpace: 'normalized' }, { locale: 'zh-CN', maxEdge: 1280 });\n        const region2 = await core.recognizeImageRegion(source, { x: 0.03, y: 0.35, width: 0.78, height: 0.24, coordinateSpace: 'normalized' }, { locale: 'zh-CN', maxEdge: 1280 });\n        const result = await core.recognizeCoffeeBag([{ id: 'live-high-res-ocr-check', role: 'front', blob }], { locale: 'zh-CN' });\n        return {\n          text: result.fullText,\n          blocks: result.blocks.length,\n          region1Text: region1.fullText || '',\n          region2Text: region2.fullText || '',\n          region1Protocol: region1.regionProtocol || '',\n          region2Protocol: region2.regionProtocol || '',\n          region1Output: [region1.outputWidth || 0, region1.outputHeight || 0],\n          region2Output: [region2.outputWidth || 0, region2.outputHeight || 0],\n"""
          if s.count(old_try)!=1: raise SystemExit('live OCR execution anchor mismatch')
          s=s.replace(old_try,new_try,1)
          validation="    requireCondition(/ETHIOPIA/i.test(ocr?.text) && /WASHED/i.test(ocr?.text), `Live OCR text mismatch: ${JSON.stringify(ocr)}`);\n"
          validation_new=(
            "    requireCondition(/ETHIOPIA/i.test(ocr?.region1Text), `Live Region 1 OCR mismatch: ${JSON.stringify(ocr)}`);\n"
            "    requireCondition(/WASHED/i.test(ocr?.region2Text), `Live Region 2 OCR mismatch: ${JSON.stringify(ocr)}`);\n"
            "    requireCondition(ocr?.region1Protocol === 'recognition-roi/1.0' && ocr?.region2Protocol === 'recognition-roi/1.0', `Live Region OCR protocol mismatch: ${JSON.stringify(ocr)}`);\n"+
            validation)
          if s.count(validation)!=1: raise SystemExit('live Region validation anchor mismatch')
          s=s.replace(validation,validation_new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Resolve immutable git dependency and lockfile
        run: npm install --no-audit --no-fund
      - name: Run full AromaSense checks
        run: npm run check
      - name: Verify pinned provider and live-smoke syntax
        run: |
          node --check scripts/live-pages-smoke.mjs
          grep -F "github:zjcrop/luckybean#fc12bcf01a8366734a681d7e33694920b52e99bd" package-lock.json
          grep -F "const VERSION = '0.4.12'" node_modules/luckybean-static-app/src/recognition-paddle-ocr.js
      - name: Commit atomic product pin
        run: |
          git config user.name "zjcrop"
          git config user.email "127176814+zjcrop@users.noreply.github.com"
          git add package.json package-lock.json tests/ocr-freeze-regression.test.ts scripts/live-pages-smoke.mjs
          git commit -m "fix(ocr): pin Foundation 0.4.12 and gate Region cold start"
          git push origin HEAD:main
