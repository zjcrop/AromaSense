name: One-shot floating rail width correction

on:
  push:
    branches: [main]
    paths:
      - 'scripts/oneshot_fix_float_width.py'
      - '.github/workflows/oneshot-fix-float-width.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply width correction
        run: python scripts/oneshot_fix_float_width.py
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full checks
        run: npm run check
      - name: Commit product correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zjcrop'
          git config user.email '127176814+zjcrop@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(cupping): keep floating rail marker width live'
          git push origin HEAD:main
