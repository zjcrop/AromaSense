            scrollContainer.addEventListener("scroll", state.scrollHandler, { passive: true });
            if (typeof ResizeObserver !== "undefined") {
              state.resizeObserver = new ResizeObserver(() => positionActiveTab(root, false));
              state.resizeObserver.observe(scrollContainer);
              if (railHost) state.resizeObserver.observe(railHost);
            }
            state.resizeHandler = () => positionActiveTab(root, false);
            window.addEventListener("resize", state.resizeHandler, { passive: true });
            activeTabStates.set(root, state);
            return state;
          }''')

          replace_once(rail, '''function targetActiveTabGeometry(root: HTMLElement): ActiveTabGeometry | undefined {
            const state = ensureActiveTabState(root);
            const card = activeCard(root);
            const number = card?.querySelector<HTMLElement>(".sample-rail__number");
            const copy = card?.querySelector<HTMLElement>(".sample-rail__active-copy");
            const rail = state.scrollContainer;
            if (!card || !number || !rail) return undefined;
            const cardRect = card.getBoundingClientRect();
            const numberRect = number.getBoundingClientRect();
            const copyRect = copy?.getBoundingClientRect();
            const railRect = rail.getBoundingClientRect();
            const compact = root.classList.contains("is-compact");
            const requiredHeight = Math.max(numberRect.height + (compact ? 6 : 8), (copyRect?.height ?? 0) + 12);
            const height = Math.ceil(Math.max(compact ? 33 : 48, requiredHeight));
            const protrusion = compact ? 7 : 18;
            const left = Math.round(cardRect.left - 1);
            const visible = cardRect.bottom > railRect.top && cardRect.top < railRect.bottom;
            return {
              top: Math.round(cardRect.top + cardRect.height / 2 - height / 2),
              left,
              width: Math.max(compact ? 40 : 54, Math.round(railRect.right + protrusion - left)),
              height,
              visible
            };
          }''', '''function targetActiveTabGeometry(root: HTMLElement): ActiveTabGeometry | undefined {
            const state = ensureActiveTabState(root);
            const card = activeCard(root);
            const number = card?.querySelector<HTMLElement>(".sample-rail__number");
            const copy = card?.querySelector<HTMLElement>(".sample-rail__active-copy");
            const railHost = state.railHost;
            const viewport = state.scrollContainer;
            if (!card || !number || !railHost || !viewport) return undefined;
            const cardRect = card.getBoundingClientRect();
            const numberRect = number.getBoundingClientRect();
            const copyRect = copy?.getBoundingClientRect();
            const railRect = railHost.getBoundingClientRect();
            const viewportRect = viewport.getBoundingClientRect();
            const compact = root.classList.contains("is-compact");
            const requiredHeight = Math.max(numberRect.height + (compact ? 6 : 8), (copyRect?.height ?? 0) + 12);
            const height = Math.ceil(Math.max(compact ? 33 : 48, requiredHeight));
            const protrusion = compact ? 9 : 16;
            const left = Math.max(2, Math.round(cardRect.left - railRect.left - 2));
            const visible = cardRect.bottom > viewportRect.top && cardRect.top < viewportRect.bottom;
            return {
              top: Math.round(cardRect.top - railRect.top + cardRect.height / 2 - height / 2),
              left,
              width: Math.max(compact ? 38 : 54, Math.round(railRect.width + protrusion - left - 2)),
              height,
              visible
            };
          }''')

          replace_once(rail, '''  if (!target.visible || !animate || duration <= 0 || !fromRect) return;
            state.tab.animate(
              [
                { left: `${Math.round(fromRect.left)}px`, top: `${Math.round(fromRect.top)}px`, width: `${Math.round(fromRect.width)}px`, height: `${Math.round(fromRect.height)}px`, opacity: 1 },
                { left: `${target.left}px`, top: `${target.top}px`, width: `${target.width}px`, height: `${target.height}px`, opacity: 1 }
              ],
              { duration, easing: ACTIVATION_EASING }
            );''', '''  if (!target.visible || !animate || duration <= 0 || !fromRect) return;
            const hostRect = state.railHost?.getBoundingClientRect();
            const fromLeft = hostRect ? Math.round(fromRect.left - hostRect.left) : Math.round(fromRect.left);
            const fromTop = hostRect ? Math.round(fromRect.top - hostRect.top) : Math.round(fromRect.top);
            state.tab.animate(
              [
                { left: `${fromLeft}px`, top: `${fromTop}px`, width: `${Math.round(fromRect.width)}px`, height: `${Math.round(fromRect.height)}px`, opacity: 1 },
                { left: `${target.left}px`, top: `${target.top}px`, width: `${target.width}px`, height: `${target.height}px`, opacity: 1 }
              ],
              { duration, easing: ACTIVATION_EASING }
            );''')

          replace_once(rail, '''  root.append(activeTabState.tab);''', '''  activeTabState.railHost?.append(activeTabState.tab);''')

          stable = "app/ui/dom/stable-cupping-screen-renderer.ts"
          replace_once(stable, '''interface ManagerMessage { text: string; error?: boolean; }
          ''', '''interface ManagerMessage { text: string; error?: boolean; }
          interface RuntimeRecognitionDraft {
            version: 1;
            sessionId: string;
            page: RecognizedPage;
            index: number;
            addedSampleIds: string[];
            preview?: string;
            updatedAt: string;
          }
          ''')

          replace_once(stable, '''    .cupping-layout__rail-list.sample-rail{overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important;overscroll-behavior-y:contain!important;scroll-behavior:smooth!important;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
              .sample-rail__active-tab{display:none!important}
              .sample-rail__item.is-active::before{content:"";position:absolute;z-index:1;inset:1px -4px 1px -6px;border:1px solid rgba(214,173,99,.34);border-left:0;border-radius:0 999px 999px 0;background:linear-gradient(90deg,rgba(104,78,39,.96),rgba(128,95,45,.96));box-shadow:0 4px 14px rgba(0,0,0,.24),inset -1px 0 0 rgba(255,255,255,.08);pointer-events:none}''', '''    .cupping-layout__rail-list.sample-rail{overflow-x:hidden!important;overflow-y:auto!important;touch-action:pan-y!important;overscroll-behavior-y:contain!important;scroll-behavior:smooth!important;-webkit-overflow-scrolling:touch;scrollbar-width:none!important;-ms-overflow-style:none!important}
              .cupping-layout__rail-list.sample-rail::-webkit-scrollbar,.cupping-main__editor::-webkit-scrollbar,.batch-review__panel::-webkit-scrollbar,.free-cupping-manager__panel::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
              .cupping-main__editor,.batch-review__panel,.free-cupping-manager__panel{scrollbar-width:none!important;-ms-overflow-style:none!important}
              .sample-rail__active-tab{display:block!important}
              .sample-rail__item.is-active::before{content:none!important;display:none!important}''')

          replace_once(stable, '''  private managerMessage?: ManagerMessage;
            private managerPageMode = false;''', '''  private managerMessage?: ManagerMessage;
            private managerPageMode = false;
            private runtimeDraftMemory?: RuntimeRecognitionDraft;''')

          marker = '''  private async recognizeAndReviewPhoto(file: File, add: HTMLButtonElement, status: HTMLElement): Promise<void> {'''
          helper = '''  private runtimeDraftKey(): string | undefined {
            const sessionId = this.controller.current()?.sessionId?.trim();
            return sessionId ? `aromasense.runtime-recognition-draft.v1.${sessionId}` : undefined;
          }

          private reviewedSample(sample: RecognizedSample, value: BatchReviewValue): RecognizedSample {
            const metadata: Record<string, unknown> = { ...sample.metadata };
            for (const [key] of EDITABLE_SAMPLE_FIELDS) delete metadata[key];
            for (const [key, fieldValue] of Object.entries(value.fields)) {
              const normalized = fieldValue.trim();
              if (normalized) metadata[key] = normalized;
            }
            return { ...sample, label: value.label.trim(), metadata };
          }

          private saveRuntimeRecognitionDraft(
            page: RecognizedPage,
            index: number,
            addedSampleIds: readonly string[],
            preview?: string,
            currentValue?: BatchReviewValue
          ): RuntimeRecognitionDraft | undefined {
            const sessionId = this.controller.current()?.sessionId;
            const key = this.runtimeDraftKey();
            if (!sessionId || !key || !page.samples.length) return undefined;
            const safeIndex = Math.max(0, Math.min(page.samples.length - 1, Math.trunc(index)));
            const samples = page.samples.map((sample, sampleIndex) =>
              sampleIndex === safeIndex && currentValue ? this.reviewedSample(sample, currentValue) : sample
            );
            const draft: RuntimeRecognitionDraft = {
              version: 1,
              sessionId,
              page: { ...page, samples },
              index: safeIndex,
              addedSampleIds: [...new Set(addedSampleIds.filter(Boolean))],
              preview,
              updatedAt: this.options.now()
            };
            this.runtimeDraftMemory = draft;
            try {
              const persisted = preview && preview.length > 750_000 ? { ...draft, preview: undefined } : draft;
              window.localStorage?.setItem(key, JSON.stringify(persisted));
            } catch { /* in-memory draft still protects the current app lifetime */ }
            return draft;
          }

          private loadRuntimeRecognitionDraft(): RuntimeRecognitionDraft | undefined {
            const state = this.controller.current();
            const key = this.runtimeDraftKey();
            if (!state || !key) return undefined;
            if (this.runtimeDraftMemory?.sessionId === state.sessionId) return this.runtimeDraftMemory;
            try {
              const raw = window.localStorage?.getItem(key);
              if (!raw) return undefined;
              const parsed = JSON.parse(raw) as Partial<RuntimeRecognitionDraft>;
              if (parsed.version !== 1 || parsed.sessionId !== state.sessionId || !parsed.page || !Array.isArray(parsed.page.samples) || !parsed.page.samples.length) return undefined;
              const index = Number(parsed.index);
              if (!Number.isInteger(index) || index < 0 || index >= parsed.page.samples.length) return undefined;
              const draft: RuntimeRecognitionDraft = {
                version: 1,
                sessionId: state.sessionId,
                page: parsed.page as RecognizedPage,
                index,
                addedSampleIds: Array.isArray(parsed.addedSampleIds) ? parsed.addedSampleIds.map(String).filter(Boolean) : [],
                preview: typeof parsed.preview === "string" ? parsed.preview : undefined,
                updatedAt: typeof parsed.updatedAt === "string" ? parsed.updatedAt : ""
              };
              this.runtimeDraftMemory = draft;
              return draft;
            } catch { return undefined; }
          }

          private clearRuntimeRecognitionDraft(): void {
            const key = this.runtimeDraftKey();
            this.runtimeDraftMemory = undefined;
            if (!key) return;
            try { window.localStorage?.removeItem(key); } catch { /* best effort */ }
          }

          ''' + marker
          replace_once(stable, marker, helper)

          replace_once(stable, '''      const preview = await previewPromise;
              this.setBusyProgress(true, 80, `识别完成 · 等待确认 ${page.samples.length} 个豆子`);
              status.textContent = `识别到 ${page.samples.length} 个豆子，请逐一确认后加入当前杯测。`;
              this.openRecognitionReview(page, preview, status, add);''', '''      const preview = await previewPromise;
              this.saveRuntimeRecognitionDraft(page, 0, [], preview);
              this.setBusyProgress(false, 100, "");
              status.textContent = `识别到 ${page.samples.length} 个豆子，请逐一确认后加入当前杯测。`;
              this.openRecognitionReview(page, preview, status, add, 0, []);''')

          replace_once(stable, '''  private openRecognitionReview(page: RecognizedPage, preview: string | undefined, status: HTMLElement, add: HTMLButtonElement): void {
            const samples = [...page.samples];
            const addedIds: string[] = [];
            const openAt = (index: number): void => {''', '''  private openRecognitionReview(
            page: RecognizedPage,
