name: One-shot rail and runtime review repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneshot-fix-rail-runtime-review.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply bounded source repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement target, found {count}\nTARGET:\n{old[:500]}")
              p.write_text(text.replace(old, new, 1))

          rail = "app/ui/dom/sample-rail-renderer.ts"
          replace_once(rail, '''interface ActiveTabState {
            tab: HTMLElement;
            scrollContainer?: HTMLElement;
            scrollHandler?: () => void;
            resizeHandler?: () => void;
            resizeObserver?: ResizeObserver;
          }''', '''interface ActiveTabState {
            tab: HTMLElement;
            railHost?: HTMLElement;
            scrollContainer?: HTMLElement;
            scrollHandler?: () => void;
            resizeHandler?: () => void;
            resizeObserver?: ResizeObserver;
          }''')

          replace_once(rail, '''      overflow:hidden!important;''', '''      overflow:visible!important;''')
          replace_once(rail, '''    .cupping-layout__rail-list{
              flex:1 1 auto;
              min-height:0;
              overflow-y:auto!important;
              overflow-x:hidden!important;
              scrollbar-width:thin;
            }
            .sample-rail{position:relative;overflow:visible!important}''', '''    .cupping-layout__rail-list{
              position:relative;
              z-index:2;
              flex:1 1 auto;
              min-height:0;
              overflow-y:auto!important;
              overflow-x:hidden!important;
              scrollbar-width:none;
              -ms-overflow-style:none;
            }
            .cupping-layout__rail-list::-webkit-scrollbar{width:0;height:0;display:none}
            .sample-rail{position:relative}''')

          replace_once(rail, '''    .sample-rail__item.is-active{
              border-top-color:transparent!important;
              border-right-color:transparent!important;
              border-bottom-color:rgba(255,255,255,.05)!important;
              background:transparent!important;
              box-shadow:none!important;
            }''', '''    .sample-rail__item.is-active{
              z-index:8!important;
              border-top-color:transparent!important;
              border-right-color:transparent!important;
              border-bottom-color:rgba(255,255,255,.05)!important;
              background:transparent!important;
              box-shadow:none!important;
            }
            .sample-rail__item.is-active .sample-rail__select,
            .sample-rail__item.is-active .sample-rail__number,
            .sample-rail__item.is-active .sample-rail__active-copy{
              position:relative;
              z-index:9!important;
            }
            .sample-rail__item.is-active .sample-rail__sample-name{
              position:relative;
              z-index:10!important;
              font-size:clamp(20px,2vw,23px)!important;
              font-weight:760!important;
              text-shadow:0 1px 9px rgba(0,0,0,.32);
            }''')

          replace_once(rail, '''    .sample-rail__active-tab{
              position:fixed;
              z-index:1;
              margin:0;
              border:1px solid rgba(214,173,99,.34);
              border-left:0;
              border-radius:0 999px 999px 0;
              background:linear-gradient(90deg,rgba(104,78,39,.96),rgba(128,95,45,.96));
              box-shadow:0 4px 14px rgba(0,0,0,.24),inset -1px 0 0 rgba(255,255,255,.08);
              opacity:0;
              pointer-events:none;
              transform:translate3d(0,0,0);
              transform-origin:left center;
              will-change:left,top,width,height,opacity,transform;
            }''', '''    .sample-rail__active-tab{
              position:absolute;
              z-index:1;
              margin:0;
              border:1px solid rgba(214,173,99,.42);
              border-radius:14px 999px 999px 14px;
              background:linear-gradient(90deg,rgba(82,64,37,.92),rgba(128,95,45,.96));
              box-shadow:0 5px 18px rgba(0,0,0,.30),inset 0 0 0 1px rgba(255,255,255,.055);
              opacity:0;
              pointer-events:none;
              transform:translate3d(0,0,0);
              transform-origin:left center;
              will-change:left,top,width,height,opacity,transform;
            }''')

          replace_once(rail, '''function ensureActiveTabState(root: HTMLElement): ActiveTabState {
            const current = activeTabStates.get(root);
            if (current) return current;
            const tab = element("span", "sample-rail__active-tab");
            tab.setAttribute("aria-hidden", "true");
            root.append(tab);
            const scrollContainer = root.closest<HTMLElement>(".cupping-layout__rail") ?? undefined;
            const state: ActiveTabState = { tab, scrollContainer };
            if (scrollContainer) {
              state.scrollHandler = () => positionActiveTab(root, false);
              scrollContainer.addEventListener("scroll", state.scrollHandler, { passive: true });
              if (typeof ResizeObserver !== "undefined") {
                state.resizeObserver = new ResizeObserver(() => positionActiveTab(root, false));
                state.resizeObserver.observe(scrollContainer);
              }
            }
            state.resizeHandler = () => positionActiveTab(root, false);
            window.addEventListener("resize", state.resizeHandler, { passive: true });
            activeTabStates.set(root, state);
            return state;
          }''', '''function ensureActiveTabState(root: HTMLElement): ActiveTabState {
            const current = activeTabStates.get(root);
            if (current) return current;
            const tab = element("span", "sample-rail__active-tab");
            tab.setAttribute("aria-hidden", "true");
            const railHost = root.closest<HTMLElement>(".cupping-layout__rail") ?? undefined;
            const scrollContainer = root;
            const state: ActiveTabState = { tab, railHost, scrollContainer };
            (railHost ?? document.body).append(tab);
