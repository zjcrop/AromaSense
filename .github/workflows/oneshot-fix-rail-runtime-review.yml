          replace_once(stable, '''        onExit: () => {
                  this.runtimeReview?.close(); this.runtimeReview = undefined; add.disabled = false;
                  this.setBusyProgress(false, 0, "");
                  status.textContent = addedIds.length ? `已加入 ${addedIds.length} 个豆子；其余候选未确认，因此没有写入。` : "已取消本次新增；未确认豆子没有写入。";
                },''', '''        onExit: (value) => {
                  this.saveRuntimeRecognitionDraft(page, index, addedIds, preview, value);
                  this.runtimeReview?.close(); this.runtimeReview = undefined; add.disabled = false;
                  this.setBusyProgress(false, 0, "");
                  this.managerMessage = { text: `识别结果已暂存：已加入 ${addedIds.length} 个，待确认 ${samples.length - index} 个。可随时继续确认。` };
                  this.rebuildManager();
                },''')

          replace_once(stable, '''          const metadata: Record<string, unknown> = { ...sample.metadata };
                  for (const [key] of EDITABLE_SAMPLE_FIELDS) delete metadata[key];
                  for (const [key, fieldValue] of Object.entries(value.fields)) if (fieldValue.trim()) metadata[key] = fieldValue.trim();''', '''          const reviewed = this.reviewedSample(sample, value);
                  const metadata: Record<string, unknown> = { ...reviewed.metadata };''')
          replace_once(stable, '''          await this.controller.addSample(id, { label: value.label.trim(), metadata }, this.options.now());
                  addedIds.push(id);
                  this.runtimeReview?.close(); this.runtimeReview = undefined;
                  if (index + 1 < samples.length) { openAt(index + 1); return; }
                  this.setBusyProgress(true, 100, "新增豆子确认完成");
                  await this.finishRuntimeAddition(addedIds, status);''', '''          try {
                    await this.controller.addSample(id, { label: reviewed.label, metadata }, this.options.now());
                    addedIds.push(id);
                    this.runtimeReview?.close(); this.runtimeReview = undefined;
                    if (index + 1 < samples.length) {
