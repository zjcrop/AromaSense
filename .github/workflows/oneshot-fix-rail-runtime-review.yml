          replace_once(stable, '''    const add = document.createElement("button"); add.type = "button"; add.className = "free-cupping-manager__add"; add.textContent = "+ 拍照识别添加豆子"; add.addEventListener("click", () => captureInput.click());
            captureInput.addEventListener("change", () => { const file = captureInput.files?.[0]; captureInput.value = ""; if (file) void this.recognizeAndReviewPhoto(file, add, status); });

            const list = document.createElement("div");''', '''    const add = document.createElement("button"); add.type = "button"; add.className = "free-cupping-manager__add"; add.textContent = "+ 拍照识别添加豆子"; add.addEventListener("click", () => captureInput.click());
            captureInput.addEventListener("change", () => { const file = captureInput.files?.[0]; captureInput.value = ""; if (file) void this.recognizeAndReviewPhoto(file, add, status); });
            const pendingDraft = this.loadRuntimeRecognitionDraft();
