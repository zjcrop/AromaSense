name: Apply Region Performance Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-region-performance-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      PATCH_REVISION: "3"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Correct preview patch cardinality
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-region-performance-fix.py')
          s = p.read_text(encoding='utf-8')
          old = 'patch("app/ui/dom/image-review-preview.ts", "quality:0.82", "quality:0.76")'
          new = '''preview = Path('app/ui/dom/image-review-preview.ts')\npreview_text = preview.read_text(encoding='utf-8')\nif preview_text.count("quality:0.82") != 2:\n    raise SystemExit('image-review-preview.ts: expected exactly two JPEG quality paths')\npreview.write_text(preview_text.replace("quality:0.82", "quality:0.76"), encoding='utf-8')'''
          if s.count(old) != 1:
              raise SystemExit('patch driver anchor mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply region performance patch
        run: python scripts/apply-region-performance-fix.py
      - name: Verify typecheck and tests
        run: npm run check
      - name: Commit validated region fix
        run: |
          git config user.name "zjcrop"
          git config user.email "127176814+zjcrop@users.noreply.github.com"
          git add app/core/sample-roi-refinement.ts app/core/sample-region-batch-recognition.ts app/core/sample-recognition-service.ts app/ui/dom/image-review-preview.ts app/ui/dom/long-operation-progress.ts tests/region-runtime-performance.test.ts
          git commit -m "fix(ocr): reuse source image and stabilize region ETA"
          git push origin HEAD:main
