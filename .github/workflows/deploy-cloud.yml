name: Cloud Backend Deploy (requires Cloudflare secrets)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AROMASENSE_D1_DATABASE_ID: ${{ vars.AROMASENSE_D1_DATABASE_ID }}
      AROMASENSE_D1_DATABASE_NAME: ${{ vars.AROMASENSE_D1_DATABASE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate deployment configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$AROMASENSE_D1_DATABASE_ID" || (echo "Missing AROMASENSE_D1_DATABASE_ID" && exit 1)
          test -n "$AROMASENSE_D1_DATABASE_NAME" || (echo "Missing AROMASENSE_D1_DATABASE_NAME" && exit 1)

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Generate deployment config
        run: |
          cat > wrangler.deploy.jsonc <<EOF
          {
            "$schema": "node_modules/wrangler/config-schema.json",
            "name": "aromasense-api",
            "main": "./src/index.ts",
            "compatibility_date": "2026-08-24",
            "observability": { "enabled": true },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "$AROMASENSE_D1_DATABASE_NAME",
                "database_id": "$AROMASENSE_D1_DATABASE_ID",
                "migrations_dir": "migrations"
              }
            ]
          }
          EOF

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$AROMASENSE_D1_DATABASE_NAME" --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      - name: Remove generated config
        if: always()
        run: rm -f wrangler.deploy.jsonc
