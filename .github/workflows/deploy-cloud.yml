name: Deploy AromaSense Cloud + Connected Web B0.1.a

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: aromasense-production
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  AROMASENSE_D1_DATABASE_NAME: ${{ vars.AROMASENSE_D1_DATABASE_NAME }}
  AROMASENSE_PUBLIC_APP_URL: ${{ vars.AROMASENSE_PUBLIC_APP_URL }}
  AROMASENSE_CLOUD_URL_FALLBACK: ${{ vars.AROMASENSE_CLOUD_URL }}
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
  FIREBASE_WEB_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}

jobs:
  cloud:
    name: Provision D1, deploy Worker, verify cloud
    runs-on: ubuntu-24.04
    outputs:
      worker_url: ${{ steps.deploy_worker.outputs.worker_url }}
    defaults:
      run:
        working-directory: cloud/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Normalize non-secret configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "AROMASENSE_D1_DATABASE_NAME=${AROMASENSE_D1_DATABASE_NAME:-aromasense-db}" >> "$GITHUB_ENV"
          echo "AROMASENSE_PUBLIC_APP_URL=${AROMASENSE_PUBLIC_APP_URL:-https://zjcrop.github.io/AromaSense/}" >> "$GITHUB_ENV"

      - name: Validate external prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Cloudflare configuration::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Cloudflare configuration::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then
            echo "::error title=Firebase configuration::Missing repository variable FIREBASE_PROJECT_ID"
            missing=1
          fi
          if [ -z "${FIREBASE_WEB_API_KEY:-}" ]; then
            echo "::error title=Firebase configuration::Missing repository variable FIREBASE_WEB_API_KEY"
            missing=1
          fi
          case "${AROMASENSE_PUBLIC_APP_URL:-}" in
            https://*) ;;
            *) echo "::error title=Cloudflare configuration::AROMASENSE_PUBLIC_APP_URL must use https://"; missing=1 ;;
          esac
          [ "$missing" -eq 0 ] || exit 1

      - name: Install Worker dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck Worker
        run: npm run typecheck

      - name: Find or create D1 database
        shell: bash
        run: |
          set -euo pipefail
          find_db_id() {
            npx wrangler d1 list --json > d1-list.json
            node - "$AROMASENSE_D1_DATABASE_NAME" <<'NODE'
          const fs = require('node:fs');
          const wanted = process.argv[2];
          const parsed = JSON.parse(fs.readFileSync('d1-list.json', 'utf8'));
          const rows = Array.isArray(parsed) ? parsed : Array.isArray(parsed.result) ? parsed.result : [];
          const row = rows.find((item) => item && (item.name === wanted || item.database_name === wanted));
          if (row) process.stdout.write(String(row.uuid ?? row.id ?? row.database_id ?? ''));
          NODE
          }

          DB_ID="$(find_db_id)"
          if [ -z "$DB_ID" ]; then
            echo "D1 '$AROMASENSE_D1_DATABASE_NAME' does not exist; creating it in APAC."
            npx wrangler d1 create "$AROMASENSE_D1_DATABASE_NAME" --location=apac
            DB_ID="$(find_db_id)"
          fi
          test -n "$DB_ID" || (echo "::error::Unable to resolve D1 database ID after create/list" && exit 1)
          echo "Resolved D1: $AROMASENSE_D1_DATABASE_NAME ($DB_ID)"
          echo "AROMASENSE_D1_DATABASE_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Generate production Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const config = {
            $schema: 'node_modules/wrangler/config-schema.json',
            name: 'aromasense-api',
            main: './src/index.ts',
            compatibility_date: '2026-08-24',
            workers_dev: true,
            observability: { enabled: true },
            d1_databases: [{
              binding: 'DB',
              database_name: process.env.AROMASENSE_D1_DATABASE_NAME,
              database_id: process.env.AROMASENSE_D1_DATABASE_ID,
              migrations_dir: 'migrations'
            }],
            vars: {
              FIREBASE_PROJECT_ID: process.env.FIREBASE_PROJECT_ID,
              PUBLIC_APP_URL: process.env.AROMASENSE_PUBLIC_APP_URL
            }
          };
          fs.writeFileSync('wrangler.deploy.jsonc', JSON.stringify(config, null, 2));
          NODE

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply "$AROMASENSE_D1_DATABASE_NAME" --remote --config wrangler.deploy.jsonc

      - name: Deploy Worker and capture production URL
        id: deploy_worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.deploy.jsonc 2>&1 | tee deploy.log
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | tail -n 1 || true)"
          if [ -z "$WORKER_URL" ]; then
            WORKER_URL="${AROMASENSE_CLOUD_URL_FALLBACK:-}"
          fi
          WORKER_URL="${WORKER_URL%/}"
          test -n "$WORKER_URL" || (echo "::error::Wrangler deployment completed but no workers.dev production URL could be resolved" && exit 1)
          case "$WORKER_URL" in
            https://*) ;;
            *) echo "::error::Resolved Worker URL must use https://"; exit 1 ;;
          esac
          echo "Resolved Worker URL: $WORKER_URL"
          echo "worker_url=$WORKER_URL" >> "$GITHUB_OUTPUT"

      - name: Verify deployed health contract
        env:
          WORKER_URL: ${{ steps.deploy_worker.outputs.worker_url }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base = process.env.WORKER_URL.replace(/\/$/, '');
          let last;
          for (let attempt = 1; attempt <= 8; attempt += 1) {
            try {
              const response = await fetch(`${base}/health`, { cache: 'no-store' });
              const body = await response.json();
              console.log(`health attempt ${attempt}`, body);
              if (response.ok && body.ok === true && body.database === 'configured' && body.authentication === 'firebase-configured') process.exit(0);
              last = new Error(`health contract incomplete: database=${body.database}, authentication=${body.authentication}`);
            } catch (error) {
              last = error;
            }
            await new Promise((resolve) => setTimeout(resolve, 3000));
          }
          throw last ?? new Error('Worker health check failed');
          NODE

      - name: Remove generated deployment files
        if: always()
        run: rm -f wrangler.deploy.jsonc d1-list.json deploy.log

  connected-web:
    name: Build web with Worker + Firebase
    runs-on: ubuntu-24.04
    needs: cloud
    env:
      AROMASENSE_CLOUD_URL: ${{ needs.cloud.outputs.worker_url }}
      AROMASENSE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
      AROMASENSE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate connected configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AROMASENSE_CLOUD_URL"
          test -n "$AROMASENSE_FIREBASE_API_KEY"
          test -n "$AROMASENSE_FIREBASE_PROJECT_ID"
          case "$AROMASENSE_CLOUD_URL" in
            https://*) ;;
            *) echo "Worker URL must use https://"; exit 1 ;;
          esac

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build connected browser version
        run: npm run bundle:web

      - name: Validate connected Pages artifact
        shell: bash
        run: |
          set -euxo pipefail
          test -f site/index.html
          test -f site/app.js
          test -f site/sql-wasm.wasm
          ! grep -q '__CLOUD_BASE_URL__\|__FIREBASE_API_KEY__\|__FIREBASE_PROJECT_ID__' site/index.html
          grep -Fq "data-cloud-base-url=\"$AROMASENSE_CLOUD_URL\"" site/index.html
          grep -Fq "data-firebase-api-key=\"$AROMASENSE_FIREBASE_API_KEY\"" site/index.html
          grep -Fq "data-firebase-project-id=\"$AROMASENSE_FIREBASE_PROJECT_ID\"" site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload connected Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  connected-android:
    name: Build Android with Worker + Firebase
    runs-on: ubuntu-24.04
    needs: cloud
    env:
      AROMASENSE_CLOUD_URL: ${{ needs.cloud.outputs.worker_url }}
      AROMASENSE_FIREBASE_API_KEY: ${{ vars.FIREBASE_WEB_API_KEY }}
      AROMASENSE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Setup Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Assemble connected B0.1.a debug APK
        run: gradle -p mobile/android :app:assembleDebug
      - name: Upload connected debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AromaSense-B0.1.a-connected-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  deploy-pages:
    name: Publish connected web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: connected-web
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
